# faster_qwen3_tts/server_voices/pronunciations.yaml
#
# Respellings applied to request text before synthesis. Qwen3-TTS has no pronunciation
# control -- no lexicon, no phonemes, no SSML -- so the spelling of the input is the only
# lever, and it has to change letters: capitalisation and punctuation are measured inert.
#
# Loaded only when serve-http is given --pronunciations. Matching is case-insensitive and
# whole-word; the replacement is emitted exactly as written here.
#
# Anby and Demara are NOT AUDITIONED -- first-principles guesses at AN-bee and de-MAH-ra
# (Japanese アンビー・デマラ, Chinese 安比・德玛拉 / Ānbǐ Démǎlā). Nobody has heard the model say
# either, so change them freely. The two Eridu entries have been heard and are correct.
pronunciations:
  Anby: "Anbee"
  Demara: "Demarra"
  # New Eridu is named for the Sumerian city, /ˈɛrɪduː/ -- EH-ri-doo. The doubled r
  # shortens the first vowel and pulls the stress forward, against an English reader's
  # pull toward eh-RID-yoo or ee-RYE-doo.
  Eridu: "Erridoo"
  # The in-game short form, REE-doo. The doubled ee blocks RYE-doo, which is the default
  # English reading of an open syllable.
  #
  # Does not fire inside "Eridu": the word boundary is a letter lookbehind, so the "E"
  # blocks it. Pinned by a test, because a key added later without that boundary would
  # break it silently.
  Ridu: "Reedoo"

# Spoken where a medial ellipsis was, chosen uniformly per occurrence. An ellipsis buys
# no pause at all -- the same inertness that forces respellings above, and the one
# upstream complaint with no maintainer answer. A lexical filler is what actually works:
# the spike that found typography inert found `Haha,` `Ugh,` `Hmm.` spoken every time.
#
# The delimiting commas are not decoration. Commas move prosody; hyphens and em-dashes
# are measured inert, so "- uh -" would be this same word with two characters that do
# nothing and might be voiced.
#
# An ellipsis fills wherever there is a word to its right: mid-clause it takes a comma
# both sides, opening a sentence it takes one only after. A line that trails off at the
# end keeps its dots, since there is nothing to attach to. Repeat an entry to weight it.
#
# NOT AUDITIONED as a pair -- "uh" and "um" are both ordinary English hesitations, but
# nobody has compared them in this voice. Non-English deployments should replace them
# outright ("えっと"/"あの", "어"/"음"); nothing here is language-aware.
fillers: ["uh", "um"]
